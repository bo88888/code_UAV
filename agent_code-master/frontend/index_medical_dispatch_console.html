<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>低空医疗配送任务调度看板</title>
<style>
:root{--text:#e8f1ff;--muted:#8fa3bd;--cyan:#22d3ee;--green:#34d399;--yellow:#facc15;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 9% 3%,#1b3c68 0,#07111f 34%,#020617 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}.top{max-width:1900px;margin:auto;padding:20px 28px 12px}.titleRow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}h1{margin:0;font-size:32px}.sub{margin-top:8px;color:var(--muted);line-height:1.65;max-width:1200px}.modeBar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.modeBtn{border:1px solid rgba(148,163,184,.28);background:rgba(15,23,42,.92);color:#dbeafe;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;box-shadow:0 14px 30px rgba(0,0,0,.22)}.modeBtn.active{background:linear-gradient(135deg,rgba(34,211,238,.26),rgba(52,211,153,.22));border-color:#22d3ee;color:white}.status{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-flex;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;background:#111827;border:1px solid rgba(255,255,255,.08)}.green{color:#86efac;background:rgba(52,211,153,.16)}.cyan{color:#67e8f9;background:rgba(34,211,238,.16)}.yellow{color:#fde68a;background:rgba(250,204,21,.16)}.purple{color:#c4b5fd;background:rgba(167,139,250,.16)}.shell{max-width:1900px;margin:auto;padding:0 28px 28px}.notice{margin-bottom:12px;background:rgba(15,23,42,.78);border:1px solid rgba(148,163,184,.20);border-radius:18px;padding:13px 16px;color:#cbd5e1;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.notice b{color:#e8f1ff}.noteSmall{font-size:12px;color:var(--muted);line-height:1.6}.frameWrap{height:calc(100vh - 190px);min-height:760px;background:rgba(15,23,42,.92);border:1px solid rgba(148,163,184,.22);border-radius:24px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.34)}iframe{width:100%;height:100%;border:0;background:#07111f}.links{display:flex;gap:8px;flex-wrap:wrap}.linkBtn{border:1px solid #334155;background:#08111f;color:#dbeafe;border-radius:12px;padding:8px 11px;text-decoration:none;font-size:12px;font-weight:800}@media(max-width:900px){.notice{grid-template-columns:1fr}.frameWrap{height:calc(100vh - 260px);min-height:620px}}
</style>
</head>
<body>
<header class="top">
  <div class="titleRow">
    <div><h1>低空医疗配送任务调度看板</h1><div class="sub">默认进入医疗节点网络与多任务联合调度工作台；历史地图页面保留为航线避障和离线部署实验工具。</div></div>
    <div class="status"><span class="tag green">L1—L8医疗网络</span><span class="tag cyan">四机资源池</span><span class="tag purple">多任务智能调度</span><span class="tag yellow">冷链与中继</span></div>
  </div>
  <div class="modeBar">
    <button id="modeDispatch" class="modeBtn active" onclick="switchMode('dispatch')">医疗网络智能调度 V4</button>
    <button id="modeOffline" class="modeBtn" onclick="switchMode('offline')">障碍重规划｜本地离线 V3</button>
    <button id="modeLeaflet" class="modeBtn" onclick="switchMode('leaflet')">航迹实验｜Leaflet V3</button>
    <button id="modeEngineering" class="modeBtn" onclick="switchMode('engineering')">工程离线瓦片方案</button>
  </div>
</header>
<main class="shell">
  <div class="notice"><div><b id="modeTitle">当前：医疗网络多任务智能调度 V4</b><div id="modeDesc" class="noteSmall">读取后端医疗节点、固定航线、机队和资源状态，执行批量任务排序、多航段接力、中继换电、备援机、冷链、空域和签收闭环。</div></div><div class="links"><a id="openLink" class="linkBtn" target="_blank" href="/frontend/index_medical_network_dispatch_v4.html">新窗口打开</a><a class="linkBtn" target="_blank" href="/docs">API文档</a></div></div>
  <div class="frameWrap"><iframe id="taskFrame" src="/frontend/index_medical_network_dispatch_v4.html"></iframe></div>
</main>
<script>
const modes={
  dispatch:{btn:'modeDispatch',url:'/frontend/index_medical_network_dispatch_v4.html',title:'当前：医疗网络多任务智能调度 V4',desc:'读取后端医疗节点、固定航线、机队和资源状态，执行批量任务排序、多航段接力、中继换电、备援机、冷链、空域和签收闭环。'},
  offline:{btn:'modeOffline',url:'/frontend/index_offline_dispatch_v3.html',title:'当前：本地离线障碍重规划实验 V3',desc:'用于验证本地底图、动态障碍删除、防抖重规划和离线可视化，不作为主业务调度入口。'},
  leaflet:{btn:'modeLeaflet',url:'/frontend/index_multi_agent_dispatch_v3.html',title:'当前：Leaflet 航迹与障碍实验 V3',desc:'用于验证在线底图、三机轨迹和障碍图层；正式调度结果以医疗网络智能调度 V4 为准。'},
  engineering:{btn:'modeEngineering',url:'/frontend/index_offline_tiles_architecture.html',title:'当前：PMTiles / MBTiles 工程离线架构',desc:'展示正式内网部署所需的本地瓦片、MapLibre/Leaflet和TileServer GL架构。'}
};
function switchMode(name){Object.values(modes).forEach(m=>document.getElementById(m.btn).classList.remove('active'));const m=modes[name];document.getElementById(m.btn).classList.add('active');document.getElementById('modeTitle').textContent=m.title;document.getElementById('modeDesc').textContent=m.desc;document.getElementById('openLink').href=m.url;document.getElementById('taskFrame').src=m.url;}
document.getElementById('taskFrame').addEventListener('load',()=>{try{const doc=document.getElementById('taskFrame').contentDocument;const header=doc.querySelector('header');if(header)header.style.display='none';}catch(e){}});
</script>
</body>
</html>
