<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>低空医疗配送任务调度看板</title>
<style>
:root{--bg:#06101d;--panel:#0f172a;--card:#111827;--line:#26364f;--text:#e8f1ff;--muted:#8fa3bd;--cyan:#22d3ee;--green:#34d399;--yellow:#facc15;--orange:#fb923c;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 9% 3%,#1b3c68 0,#07111f 34%,#020617 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}.top{max-width:1900px;margin:auto;padding:22px 28px 12px}.titleRow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}h1{margin:0;font-size:32px;letter-spacing:.3px}.sub{margin-top:8px;color:var(--muted);line-height:1.7;max-width:1180px}.modeBar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.modeBtn{border:1px solid rgba(148,163,184,.28);background:rgba(15,23,42,.92);color:#dbeafe;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer;box-shadow:0 14px 30px rgba(0,0,0,.22)}.modeBtn.active{background:linear-gradient(135deg,rgba(34,211,238,.26),rgba(52,211,153,.22));border-color:#22d3ee;color:white}.status{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-flex;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;background:#111827;border:1px solid rgba(255,255,255,.08)}.green{color:#86efac;background:rgba(52,211,153,.16)}.cyan{color:#67e8f9;background:rgba(34,211,238,.16)}.yellow{color:#fde68a;background:rgba(250,204,21,.16)}.purple{color:#c4b5fd;background:rgba(167,139,250,.16)}.shell{max-width:1900px;margin:auto;padding:0 28px 28px}.notice{margin-bottom:12px;background:rgba(15,23,42,.78);border:1px solid rgba(148,163,184,.20);border-radius:18px;padding:13px 16px;color:#cbd5e1;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.notice b{color:#e8f1ff}.noteSmall{font-size:12px;color:var(--muted);line-height:1.6}.frameWrap{height:calc(100vh - 190px);min-height:760px;background:rgba(15,23,42,.92);border:1px solid rgba(148,163,184,.22);border-radius:24px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.34)}iframe{width:100%;height:100%;border:0;background:#07111f}.links{display:flex;gap:8px;flex-wrap:wrap}.linkBtn{border:1px solid #334155;background:#08111f;color:#dbeafe;border-radius:12px;padding:8px 11px;text-decoration:none;font-size:12px;font-weight:800}@media(max-width:900px){.notice{grid-template-columns:1fr}.frameWrap{height:calc(100vh - 260px);min-height:620px}}
</style>
</head>
<body>
<header class="top">
  <div class="titleRow">
    <div>
      <h1>低空医疗配送任务调度看板</h1>
      <div class="sub">围绕血站、医院、检验中心、卫生院等医疗配送任务展示：任务输入、路径重规划、动态障碍、UAV 航迹、风险评估、时间窗结果和多智能体调度过程。底图只是任务态势的承载层。</div>
    </div>
    <div class="status"><span class="tag green">医疗任务优先</span><span class="tag cyan">多智能体调度</span><span class="tag purple">多 UAV 协同</span><span class="tag yellow">支持离线</span></div>
  </div>
  <div class="modeBar">
    <button id="modeOffline" class="modeBtn active" onclick="switchMode('offline')">医疗配送任务态势图｜本地离线</button>
    <button id="modeLeaflet" class="modeBtn" onclick="switchMode('leaflet')">多智能体调度图｜Leaflet 真实底图</button>
    <button id="modeEngineering" class="modeBtn" onclick="switchMode('engineering')">工程离线瓦片方案｜PMTiles / MBTiles</button>
  </div>
</header>
<main class="shell">
  <div class="notice"><div><b id="modeTitle">当前：本地离线医疗配送任务态势图</b><div id="modeDesc" class="noteSmall">不依赖外网，直接使用本地 GeoJSON 展示医疗点位、建筑、风险区、动态障碍和 UAV 航迹。适合内网演示和答辩。</div></div><div class="links"><a id="openLink" class="linkBtn" target="_blank" href="/frontend/index_offline_map.html">新窗口打开当前模式</a><a class="linkBtn" target="_blank" href="/frontend/index_multi_agent_dispatch.html">多智能体版</a><a class="linkBtn" target="_blank" href="/frontend/index_offline_map.html">离线版本</a></div></div>
  <div id="frameWrap" class="frameWrap"><iframe id="taskFrame" src="/frontend/index_offline_map.html"></iframe></div>
</main>
<script>
const modes={
  offline:{btn:'modeOffline',url:'/frontend/index_offline_map.html',title:'当前：本地离线医疗配送任务态势图',desc:'不依赖外网，直接使用本地 GeoJSON 展示医疗点位、建筑、风险区、动态障碍和 UAV 航迹。适合内网演示和答辩。'},
  leaflet:{btn:'modeLeaflet',url:'/frontend/index_multi_agent_dispatch.html',title:'当前：多智能体医疗配送调度图',desc:'突出任务智能体、路径智能体、风险智能体、CoordField 多 UAV 分配、主运输/护航/备援无人机协同。障碍物采用建筑块体、高压线塔架、敏感区多边形、受限区围栏表达。'},
  engineering:{btn:'modeEngineering',url:'/frontend/index_offline_map.html',title:'工程建议：PMTiles / MBTiles 离线瓦片交付',desc:'正式项目建议使用本地 PMTiles 单文件或 TileServer GL + MBTiles，前端用 MapLibre/Leaflet 读取本地瓦片；当前仍打开本地离线任务态势图作为无外网兜底。'}
};
function switchMode(name){Object.values(modes).forEach(m=>document.getElementById(m.btn).classList.remove('active'));const m=modes[name];document.getElementById(m.btn).classList.add('active');document.getElementById('modeTitle').textContent=m.title;document.getElementById('modeDesc').textContent=m.desc;document.getElementById('openLink').href=m.url;document.getElementById('taskFrame').src=m.url;}
document.getElementById('taskFrame').addEventListener('load',()=>{try{const doc=document.getElementById('taskFrame').contentDocument;const header=doc.querySelector('header');if(header)header.style.display='none';const main=doc.querySelector('main');if(main)main.style.paddingTop='18px';}catch(e){}});
</script>
</body>
</html>
